<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Animation Editor</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <span class="brand">Animation Editor</span>
    <button class="icon-btn" id="btn-objects" title="Открыть объект">
      <span class="material-icons">folder_open</span>
    </button>
    <input class="name-field" id="obj-name" readonly placeholder="объект не выбран">
    <button class="icon-btn" id="btn-anim" title="Анимация">
      <span class="material-icons">animation</span>
    </button>
    <input class="name-field" id="anim-name" readonly placeholder="—">
    <span class="spacer"></span>
    <button class="icon-btn" id="btn-save" title="Сохранить">
      <span class="material-icons">save</span>
    </button>
    <button class="icon-btn" id="btn-settings" title="Настройки">
      <span class="material-icons">settings</span>
    </button>
  </header>

  <main>
    <section class="center">
      <div class="viewport" id="viewport">
        <svg id="scene-svg" xmlns="http://www.w3.org/2000/svg">
          <g id="world">
            <g id="grid"></g>
            <g id="scene"></g>
          </g>
        </svg>
        <svg id="gizmo-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>

	<div class="tools-row">
	  <button class="icon-btn" data-act="zoom-out" title="Масштаб -"><span class="material-icons">remove</span></button>
	  <button class="icon-btn" data-act="zoom-in"  title="Масштаб +"><span class="material-icons">add</span></button>
	  <button class="icon-btn" data-act="zoom-fit" title="Вписать в фрэйм"><span class="material-icons">fit_screen</span></button>
	  <span class="zoom-label" id="zoom-label">100%</span>

	  <span class="sep"></span>
	  <button class="icon-btn mode-btn" data-mode="1" title="Режим: масштаб / перемещение">
		<span class="material-icons">open_with</span>
	  </button>
	  <button class="icon-btn mode-btn" data-mode="2" title="Режим: вращение / скос">
		<span class="material-icons">rotate_right</span>
	  </button>
	  <button class="icon-btn" id="btn-realtime" title="Realtime: правки сразу пишутся в кадр">
		<span class="material-icons">flash_on</span>
	  </button>
	  <button class="icon-btn" id="btn-reset-anim" title="Создать reset animation">
		<span class="material-icons">restart_alt</span>
	  </button>
		
	  <span class="sep"></span>
	  <button class="icon-btn" id="btn-bg" title="Фон">
		<span class="material-icons">palette</span>
	  </button>

	  <label class="fps-wrap" title="Скорость воспроизведения (0..60)">
		<input type="range" id="fps-slider" min="0" max="60" step="1" value="60">
		<span class="fps-value" id="fps-value">60</span>
	  </label>

	  <span class="spacer"></span>
	  <span class="sel-size" id="sel-size">---, ---</span>
	  <button class="icon-btn" id="btn-timeline-toggle" title="Свернуть / развернуть таймлайн">
		<span class="material-icons" id="timeline-toggle-icon">expand_more</span>
	  </button>
	</div>

		<div class="playback-row">
		  <button class="icon-btn" id="pb-first" title="В начало"><span class="material-icons">first_page</span></button>
		  <button class="icon-btn" id="pb-prev"  title="Кадр назад"><span class="material-icons">skip_previous</span></button>
		  <button class="icon-btn" id="pb-play"  title="Play / Pause"><span class="material-icons">play_arrow</span></button>
		  <button class="icon-btn" id="pb-stop"  title="Stop"><span class="material-icons">stop</span></button>
		  <button class="icon-btn" id="pb-next"  title="Кадр вперёд"><span class="material-icons">skip_next</span></button>
		  <button class="icon-btn" id="pb-last"  title="В конец"><span class="material-icons">last_page</span></button>

		  <span class="sep"></span>

		  <button class="icon-btn icon-btn-sm" id="pb-loop-set-start" title="Установить начало цикла">
			<span class="material-icons">first_page</span>
		  </button>
		  <span class="time-field" id="tc-loop-start">00:00:000</span>
		  <span class="time-field time-field-cur" id="tc-current">00:00:000</span>
		  <span class="time-field" id="tc-loop-end">00:00:000</span>
		  <button class="icon-btn icon-btn-sm" id="pb-loop-set-end" title="Установить конец цикла">
			<span class="material-icons">last_page</span>
		  </button>

		  <span class="sep"></span>

		  <button class="icon-btn" id="pb-key-add" title="Создать кадр на выделенной дорожке">
			<span class="material-icons">add</span>
		  </button>
		  
		<button class="icon-btn" id="btn-key-frame" title="Добавить ключевой кадр (O)">
		  <span class="material-icons">add_circle_outline</span>
		</button>
		<button class="icon-btn" id="btn-convert-keys" title="Конвертировать все кадры в ключевые">
		  <span class="material-icons">auto_fix_high</span>
		</button>
		
		  <button class="icon-btn" id="pb-key-del" title="Удалить выделенный кадр">
			<span class="material-icons">delete</span>
		  </button>
		  <button class="icon-btn" id="pb-loop" title="Зацикливание">
			<span class="material-icons">repeat</span>
		  </button>
		  <button class="icon-btn" id="pb-onion" title="Луковая кожура">
			<span class="material-icons">layers</span>
		  </button>
		  <span class="onion-wrap" title="Луковая кожура: кадров до/после">
			<span class="onion-field">
			  <input type="number" id="onion-before" class="onion-input" min="0" max="3" step="1" value="0">
			  <span class="onion-spin">
				<button type="button" data-target="onion-before" data-dir="1"  tabindex="-1"><span class="material-icons">expand_less</span></button>
				<button type="button" data-target="onion-before" data-dir="-1" tabindex="-1"><span class="material-icons">expand_more</span></button>
			  </span>
			</span>
			<span class="onion-field">
			  <input type="number" id="onion-after" class="onion-input" min="0" max="3" step="1" value="0">
			  <span class="onion-spin">
				<button type="button" data-target="onion-after" data-dir="1"  tabindex="-1"><span class="material-icons">expand_less</span></button>
				<button type="button" data-target="onion-after" data-dir="-1" tabindex="-1"><span class="material-icons">expand_more</span></button>
			  </span>
			</span>
		  </span>
		  <span class="duration-wrap" title="Полная длительность анимации">
			<span class="duration-label">total:</span>
			<input type="number" id="pb-duration" class="duration-input" step="0.1" min="0.1" value="1.00">
			<span class="duration-unit">s</span>
		  </span>
		</div>

		<div class="timeline" id="timeline">
		  <div class="tl-head-label">Таймлайн:</div>
		  <div class="tl-head-ruler-wrap">
			<div class="tl-head-ruler" id="tl-ruler">
			  <div class="tl-ruler-playhead" id="tl-ruler-playhead"></div>
			</div>
		  </div>
		  <div class="tl-names">
			<div class="tl-names-inner" id="tl-names-inner"></div>
		  </div>
		  <div class="tl-tracks" id="tl-tracks" tabindex="0">
			<div class="tl-tracks-inner" id="tl-tracks-inner">
			  <div class="tl-playhead-line" id="tl-playhead-line"></div>
			</div>
		  </div>
		</div>
    </section>

    <aside class="right">
      <div class="panel-title">
        <span>Слои</span>
        <span class="panel-actions">
          <button class="icon-btn icon-btn-sm" id="btn-group" title="Создать группу">
            <span class="material-icons">create_new_folder</span>
          </button>
          <button class="icon-btn icon-btn-sm" id="btn-ungroup" title="Разгруппировать">
            <span class="material-icons">folder_open</span>
          </button>
        </span>
      </div>
      <ul id="layers-list"></ul>

      <div class="panel-title">
        <span id="props-title">Свойства</span>
        <span class="panel-actions">
          <button class="icon-btn icon-btn-sm" id="btn-props-collapse" title="Свернуть / развернуть">
            <span class="material-icons" id="props-collapse-icon">expand_more</span>
          </button>
        </span>
      </div>
      <div class="props" id="props"></div>
    </aside>
  </main>

  <div class="modal" id="modal-objects" hidden>
    <div class="modal-box">
      <div class="modal-title">Открыть объект</div>
      <ul id="objects-list"></ul>
      <div class="modal-actions"><button id="modal-objects-close">Закрыть</button></div>
    </div>
  </div>

  <div class="modal" id="modal-rename" hidden>
    <div class="modal-box modal-box-sm">
      <div class="modal-title" id="rename-title">Переименовать</div>
      <div class="modal-body">
        <input type="text" id="rename-input" class="text-input" autocomplete="off" spellcheck="false">
      </div>
      <div class="modal-actions">
        <button id="rename-cancel">Отмена</button>
        <button id="rename-ok" class="primary">OK</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-anims" hidden>
    <div class="modal-box">
      <div class="modal-title modal-title-flex">
        <span>Анимации</span>
        <button class="icon-btn icon-btn-sm" id="modal-anims-close" title="Закрыть">
          <span class="material-icons">close</span>
        </button>
      </div>
      <ul id="anims-list"></ul>
      <div class="modal-actions modal-actions-split">
        <div class="modal-actions-left">
          <button class="icon-btn icon-btn-sm" id="anim-add" title="Создать">
            <span class="material-icons">add</span>
          </button>
          <button class="icon-btn icon-btn-sm" id="anim-rename" title="Переименовать">
            <span class="material-icons">edit</span>
          </button>
          <button class="icon-btn icon-btn-sm" id="anim-delete" title="Удалить">
            <span class="material-icons">delete</span>
          </button>
        </div>
        <button id="anim-ok">Готово</button>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-bg" hidden>
    <div class="modal-box modal-box-bg">
      <div class="modal-title modal-title-flex">
        <span>Фон</span>
        <button class="icon-btn icon-btn-sm" id="bg-close" title="Закрыть">
          <span class="material-icons">close</span>
        </button>
      </div>
      <div class="bg-presets" id="bg-presets"></div>
      <div class="bg-picker" id="bg-picker">
        <div class="bg-sv" id="bg-sv">
          <div class="bg-cursor" id="bg-cursor"></div>
        </div>
        <div class="bg-hue">
          <div class="bg-hue-cursor" id="bg-hue-cursor"></div>
        </div>
      </div>
      <div class="bg-footer">
        <input type="text" class="text-input bg-hex" id="bg-hex" value="#1a1c20" spellcheck="false" autocomplete="off">
        <div class="bg-footer-actions">
          <button class="icon-btn icon-btn-sm" id="bg-copy" title="Копировать">
            <span class="material-icons">content_copy</span>
          </button>
          <button class="icon-btn icon-btn-sm" id="bg-paste" title="Вставить">
            <span class="material-icons">content_paste</span>
          </button>
          <button id="bg-cancel">Отмена</button>
          <button id="bg-ok" class="primary">OK</button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal" id="modal-confirm" hidden>
    <div class="modal-box modal-box-sm">
      <div class="modal-title" id="confirm-title">Подтверждение</div>
      <div class="modal-body" id="confirm-text"></div>
      <div class="modal-actions">
        <button id="confirm-cancel">Отмена</button>
        <button id="confirm-ok" class="primary">OK</button>
      </div>
    </div>
  </div>
  <div class="hint" id="hint"></div>

  <script src="js/gizmo.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
